# defaults file for default-packages
default_packages_redhat:
    - bash-completion
    - bind-utils
    - cronie
    - emacs-nox
    - firewalld
    - langpacks-de
    - langpacks-en
    - langpacks-it
    - lvm2
    - lsof
    - lsscsi
    - "{{
        'mailx'
            if (
                ansible_facts['distribution'] == 'CentOS'
                and
                ansible_facts['distribution_major_version'] == '8'
                )
        else 's-nail'
        }}"
    - net-tools
    - openldap-clients
    - pciutils
    - rsync
    - tar
    - telnet
    - tmux
    - usbutils

default_packages_debian:
    - firewalld
    - libldap-common
    - ldap-utils
    - locales-all
    - lvm2
    - lsof
    - lsscsi
    - mailutils
    - postfix
    - net-tools
    - rsync
    - telnet
    - tmux
    - usbutils
