# tasks file for default-packages
- name: Import facts
  import_tasks: "../../default_facts/default_facts.yml"

- block:
  - name: Configure dnf
    ini_file:
      path: /etc/dnf/dnf.conf
      section: main
      option: "{{ item.key }}"
      value: "{{ item.value  | string }}"
    with_items:
      - { key: "gpgcheck", value: "True" }
      - { key: "repo_gpgcheck", value: "False" }
      - { key: "sslverify", value: "True" }
      - { key: "excludepkgs", value: "gnome-initial-setup" }
      - { key: "best", value: "False" }

  - name: Disable external repositories
    include_role:
      name: 01-no-external-repositories

  - name: Install updates
    dnf:
      name: "*"
      state: latest

  - name: Disable external repositories
    include_role:
      name: 01-no-external-repositories

  - name: "Install default packages {{ default_packages_redhat | join(', ') }}"
    dnf:
      name: "{{ default_packages_redhat }}"
      state: latest
  when: ansible_facts.os_family == "RedHat"

- block:
  - name: "Install default_packages {{ default_packages_debian | join(', ') }}"
    apt:
      name: "{{ default_packages_debian }}"
  when: ansible_facts.os_family == "Debian"
